<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="sal-sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="112">
      <stop offset="0" stop-color="#4FA9E8"/>
      <stop offset="1" stop-color="#D6F0FC"/>
    </linearGradient>
    <linearGradient id="sal-sea" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="182">
      <stop offset="0" stop-color="#1F8CC8"/>
      <stop offset="0.5" stop-color="#2BC0D4"/>
      <stop offset="1" stop-color="#7EE8DA"/>
    </linearGradient>
  </defs>

  <!-- bright sky -->
  <rect x="0" y="0" width="400" height="250" fill="url(#sal-sky)"/>

  <!-- the sun -->
  <circle cx="342" cy="38" r="30" fill="#FFF3C4" opacity="0.55"/>
  <circle cx="342" cy="38" r="19" fill="#FFD54F" stroke="#F2A825" stroke-width="4"/>

  <!-- the kite surfer's kite and its two lines -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M86 52 L60 134 M138 50 L60 134" fill="none" stroke="#37474F" stroke-width="1.5"/>
    <path d="M76 58 Q110 18 148 54 Q140 46 112 42 Q90 42 76 58 Z" fill="#FF7043" stroke="#A8452A" stroke-width="3"/>
    <path d="M76 58 Q110 18 148 54 Q144 40 112 30 Q88 34 76 58 Z" fill="#FFCA28" stroke="#A8452A" stroke-width="3"/>
  </g>

  <!-- the sea -->
  <rect x="-4" y="112" width="408" height="80" fill="url(#sal-sea)"/>
  <!-- the low flat end of the island far off -->
  <path d="M-4 113 Q30 106 80 108 Q110 108 126 113 Z" fill="#D8C9A6" stroke="#A8966E" stroke-width="2" stroke-linejoin="round"/>
  <line x1="-4" y1="113" x2="404" y2="113" stroke="#1D6EA6" stroke-width="2.5"/>

  <!-- the kite surfer on the water -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M48 142 H70" fill="none" stroke="#1E5E8C" stroke-width="4"/>
    <path d="M52 141 L56 132 L62 140" fill="none" stroke="#263238" stroke-width="3"/>
    <path d="M56 132 V124" fill="none" stroke="#1976D2" stroke-width="4.5"/>
    <circle cx="56" cy="120" r="3.5" fill="#C98E62" stroke="#7A4E30" stroke-width="1.5"/>
    <path d="M56 127 L60 134" fill="none" stroke="#C98E62" stroke-width="2.5"/>
  </g>

  <!-- gentle waves -->
  <g fill="none" stroke="#C8F4F4" stroke-width="2.5" stroke-linecap="round">
    <path d="M160 128 q10 -4 20 0"/>
    <path d="M330 130 q10 -4 20 0"/>
    <path d="M290 150 q10 -4 20 0"/>
    <path d="M360 158 q10 -4 20 0"/>
  </g>

  <!-- the long wooden Santa Maria pier -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- posts into the water -->
    <g fill="none" stroke="#5D4037" stroke-width="3">
      <path d="M118 186 V204 M146 182 V200"/>
      <path d="M160 170 V184 M182 168 V182"/>
      <path d="M200 156 V168 M218 154 V166"/>
      <path d="M238 143 V153 M254 141 V151"/>
      <path d="M272 131 V139 M286 130 V138"/>
    </g>
    <!-- deck -->
    <path d="M94 196 L158 190 L312 124 L298 124 Z" fill="#B88A5A" stroke="#5D4037" stroke-width="3"/>
    <path d="M94 196 L158 190 L158 196 L96 202 Z" fill="#8D6040" stroke="#5D4037" stroke-width="3"/>
    <path d="M158 190 L312 124 L312 127 L158 196 Z" fill="#8D6040" stroke="#5D4037" stroke-width="2.5"/>
    <!-- railing -->
    <path d="M100 184 L300 118 M158 180 L312 116" fill="none" stroke="#6D4C2F" stroke-width="2.5"/>
    <path d="M100 184 V196 M130 174 V186 M160 164 V177 M190 154 V166 M220 144 V154 M250 134 V143 M280 124 V131 M158 180 V190 M196 164 V174 M234 147 V157 M272 131 V140" fill="none" stroke="#6D4C2F" stroke-width="2.5"/>
  </g>

  <!-- colourful fishing boats beside the pier -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- far, small, green -->
    <g transform="translate(-94 -16)">
    <path d="M300 136 H334 Q330 144 324 145 H308 Q302 143 300 136 Z" fill="#43A047" stroke="#1B5E20" stroke-width="2.5"/>
    <path d="M302 140 H332" fill="none" stroke="#FFD54F" stroke-width="2"/>
    </g>
    <!-- middle, yellow -->
    <g transform="translate(-76 -22)">
    <path d="M232 152 H284 Q278 164 268 165 H244 Q236 162 232 152 Z" fill="#FDD835" stroke="#8D6E00" stroke-width="3"/>
    <path d="M234 157 H282" fill="none" stroke="#E53935" stroke-width="3"/>
    </g>
    <!-- near, blue and red -->
    <g transform="translate(-74 -12)">
    <path d="M180 172 H246 Q240 186 226 188 H198 Q186 185 180 172 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="3.5"/>
    <path d="M183 178 H243" fill="none" stroke="#E53935" stroke-width="3.5"/>
    <path d="M190 172 Q213 168 238 172" fill="none" stroke="#0D47A1" stroke-width="2"/>
    </g>
  </g>

  <!-- foam where the waves meet the beach -->
  <path d="M-4 184 Q60 178 120 184 Q200 192 280 184 Q340 178 404 184" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- the wide white-sand beach -->
  <path d="M-4 188 Q60 182 120 188 Q200 196 280 188 Q340 182 404 188 V254 H-4 Z" fill="#FBF4E2" stroke="#D8C8A0" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#EFE3C4">
    <ellipse cx="40" cy="232" rx="22" ry="4"/>
    <ellipse cx="300" cy="240" rx="26" ry="4.5"/>
    <ellipse cx="196" cy="214" rx="14" ry="3"/>
  </g>

  <!-- straw beach umbrellas with their shade -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="54" cy="226" rx="26" ry="5" fill="#E6D6AE"/>
    <path d="M54 200 V226" fill="none" stroke="#6D4C2F" stroke-width="4"/>
    <path d="M26 206 Q30 196 54 186 Q78 196 82 206 Q68 210 54 206 Q40 210 26 206 Z" fill="#E2B85C" stroke="#8A6420" stroke-width="3"/>
    <path d="M36 200 L33 208 M54 194 V206 M72 200 L75 208" fill="none" stroke="#B48A36" stroke-width="2"/>

    <ellipse cx="138" cy="238" rx="28" ry="5" fill="#E6D6AE"/>
    <path d="M138 210 V238" fill="none" stroke="#6D4C2F" stroke-width="4"/>
    <path d="M108 216 Q112 205 138 194 Q164 205 168 216 Q153 220 138 216 Q123 220 108 216 Z" fill="#E2B85C" stroke="#8A6420" stroke-width="3"/>
    <path d="M119 210 L116 218 M138 202 V216 M157 210 L160 218" fill="none" stroke="#B48A36" stroke-width="2"/>
    <!-- a sun lounger under it -->
    <path d="M112 236 L164 236 L170 228" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M112 236 L164 236 L170 228" fill="none" stroke="#26A69A" stroke-width="3"/>
  </g>

  <!-- two palm trees -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M324 236 Q318 186 336 126 L342 128 Q328 186 334 236 Z" fill="#A1795A" stroke="#5D4037" stroke-width="3"/>
    <path d="M370 240 Q372 198 384 150 L390 152 Q382 198 380 240 Z" fill="#A1795A" stroke="#5D4037" stroke-width="3"/>
    <g fill="#4CAF50" stroke="#2E6B30" stroke-width="3">
      <path d="M339 126 Q314 108 290 122 Q316 118 339 130 Z"/>
      <path d="M339 126 Q330 100 306 96 Q326 108 337 130 Z"/>
      <path d="M339 126 Q354 100 378 102 Q356 110 341 130 Z"/>
      <path d="M339 126 Q366 116 384 134 Q362 126 340 130 Z"/>
      <path d="M339 126 Q340 104 352 94 Q346 110 342 128 Z"/>
      <path d="M387 150 Q364 134 344 146 Q366 144 386 154 Z"/>
      <path d="M387 150 Q382 126 362 120 Q378 134 385 154 Z"/>
      <path d="M387 150 Q398 128 416 128 Q400 136 389 154 Z"/>
      <path d="M387 150 Q406 144 418 160 Q402 152 388 154 Z"/>
    </g>
    <g fill="#6D4C2F" stroke="#3E2A18" stroke-width="1.5">
      <circle cx="336" cy="132" r="3.5"/><circle cx="342" cy="133" r="3.5"/>
    </g>
    <ellipse cx="350" cy="242" rx="38" ry="5" fill="#E6D6AE"/>
  </g>

  <!-- a little beach bar with three caipirinhas -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="246" cy="223" rx="44" ry="4" fill="#E6D6AE"/>
    <!-- two posts -->
    <path d="M210 180 V223 M282 180 V223" fill="none" stroke="#6D4C2F" stroke-width="4"/>
    <!-- thatched palm-leaf roof -->
    <path d="M196 181 Q206 168 246 157 Q286 168 296 181 Q284 187 271 181 Q258 187 246 181 Q234 187 221 181 Q208 187 196 181 Z" fill="#E2B85C" stroke="#8A6420" stroke-width="3"/>
    <path d="M220 168 L214 180 M246 162 V180 M272 168 L278 180" fill="none" stroke="#B48A36" stroke-width="2.5"/>
    <!-- wooden counter -->
    <rect x="216" y="207" width="60" height="15" fill="#B88A5A" stroke="#5D4037" stroke-width="3"/>
    <path d="M236 208 V221 M256 208 V221" fill="none" stroke="#8D6040" stroke-width="2.5"/>
    <rect x="211" y="202" width="70" height="6" rx="1.5" fill="#8D6040" stroke="#5D4037" stroke-width="3"/>
    <!-- three caipirinhas on the counter -->
    <path d="M225 198 L220 177" fill="none" stroke="#2E5E1E" stroke-width="4"/>
    <path d="M225 198 L220 177" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <path d="M218 184 L220 200 Q220 202 222 202 H230 Q232 202 232 200 L234 184 Z" fill="#DCEFB0" stroke="#7E9AA8" stroke-width="2"/>
    <ellipse cx="226" cy="186.5" rx="6" ry="2.2" fill="#F7FBFD" stroke="#A9BCC6" stroke-width="1"/>
    <path d="M221.5 193 A4.5 4.5 0 0 0 230.5 193 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
    <circle cx="234" cy="184" r="4.5" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
    <circle cx="234" cy="184" r="2.8" fill="#E3F0C6"/>
    <path d="M245 198 L240 177" fill="none" stroke="#2E5E1E" stroke-width="4"/>
    <path d="M245 198 L240 177" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <path d="M238 184 L240 200 Q240 202 242 202 H250 Q252 202 252 200 L254 184 Z" fill="#DCEFB0" stroke="#7E9AA8" stroke-width="2"/>
    <ellipse cx="246" cy="186.5" rx="6" ry="2.2" fill="#F7FBFD" stroke="#A9BCC6" stroke-width="1"/>
    <path d="M241.5 193 A4.5 4.5 0 0 0 250.5 193 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
    <circle cx="254" cy="184" r="4.5" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
    <circle cx="254" cy="184" r="2.8" fill="#E3F0C6"/>
    <path d="M265 198 L260 177" fill="none" stroke="#2E5E1E" stroke-width="4"/>
    <path d="M265 198 L260 177" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <path d="M258 184 L260 200 Q260 202 262 202 H270 Q272 202 272 200 L274 184 Z" fill="#DCEFB0" stroke="#7E9AA8" stroke-width="2"/>
    <ellipse cx="266" cy="186.5" rx="6" ry="2.2" fill="#F7FBFD" stroke="#A9BCC6" stroke-width="1"/>
    <path d="M261.5 193 A4.5 4.5 0 0 0 270.5 193 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
    <circle cx="274" cy="184" r="4.5" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
    <circle cx="274" cy="184" r="2.8" fill="#E3F0C6"/>
  </g>

  <!-- a beach towel and a ball -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <polygon points="216,226 280,224 286,244 210,246" fill="#FF8A65" stroke="#A8452A" stroke-width="3"/>
    <path d="M226 226 L221 246 M270 224 L275 244" fill="none" stroke="#FFD3C2" stroke-width="3"/>
    <circle cx="300" cy="216" r="8" fill="#FFFFFF" stroke="#37474F" stroke-width="2.5"/>
    <path d="M292.5 214 Q300 210 307.5 214" fill="none" stroke="#1E88E5" stroke-width="3"/>
    <path d="M293 220 Q300 224 307 220" fill="none" stroke="#E53935" stroke-width="3"/>
  </g>
</svg>
