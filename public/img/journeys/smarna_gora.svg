  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M324 170 Q319 162 324 154 Q329 146 324 138" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.95"/>
    <path d="M308 178 Q310 193 329 193 Q348 193 350 178 Z" fill="#F5F0E6" stroke="#4F5B66" stroke-width="3"/>
    <path d="M310 184 Q329 189 348 184" fill="none" stroke="#3F7FC0" stroke-width="3"/>
    <ellipse cx="329" cy="178" rx="21" ry="5" fill="#D9B26E" stroke="#8A6A30" stroke-width="2.5"/>
    <circle cx="320" cy="178" r="2" fill="#8D4A3A"/>
    <circle cx="331" cy="179.5" r="2" fill="#8D4A3A"/>
    <circle cx="326" cy="176.5" r="1.7" fill="#F08A2C"/>
    <circle cx="339" cy="177" r="2.2" fill="#C0654A"/>
    <path d="M337 177 L353 158" fill="none" stroke="#5F6B75" stroke-width="5"/>
    <path d="M337 177 L353 158" fill="none" stroke="#CFD8DC" stroke-width="2"/>
