  <polyline points="-4,138 40,128 80,134 120,126 160,134 200,132 228,110 246,120 268,92 284,104 300,84 318,100 334,96 352,114 372,104 404,122" fill="none" stroke="#4F6B88" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

