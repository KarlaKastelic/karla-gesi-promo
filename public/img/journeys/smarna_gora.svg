  <path d="M-4 152 V138 L40 128 L80 134 L120 126 L160 134 L200 132 L228 110 L246 120 L268 92 L284 104 L300 84 L318 100 L334 96 L352 114 L372 104 L404 122 V152 Z" fill="#8EA8C6"/>
  <g fill="#7690B0">
