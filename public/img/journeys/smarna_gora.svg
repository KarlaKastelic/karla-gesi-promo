    <path d="M290 175 Q300 175 300 182 Q300 189 290 189" fill="none" stroke="#8E1F1B" stroke-width="4"/>
    <path d="M269 170 H291 V186 Q291 192 285 192 H275 Q269 192 269 186 Z" fill="#E53935" stroke="#8E1F1B" stroke-width="3"/>
    <ellipse cx="280" cy="170" rx="11" ry="3.2" fill="#B5652A" stroke="#8E1F1B" stroke-width="2.5"/>
    <path d="M275 177 V186" fill="none" stroke="#F28B82" stroke-width="2.5"/>
