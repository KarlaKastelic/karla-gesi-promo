    <rect x="36" y="48" width="38" height="6" rx="2" fill="#E6DED0" stroke="#5B5550" stroke-width="3"/>
    <path d="M49 74 V65 Q55 57 61 65 V74 Z" fill="#5B4636" stroke="#3E2F24" stroke-width="2.5"/>
    <circle cx="55" cy="70" r="3" fill="#E0A820"/>
    <path d="M38 48 Q40 40 47 38 Q44 31 55 20 Q66 31 63 38 Q70 40 72 48 Z" fill="#6D7B86" stroke="#37414A" stroke-width="3"/>
    <path d="M55 20 V9 M51 13 H59" fill="none" stroke="#37414A" stroke-width="2.5"/>
    <!-- tower door -->
    <path d="M48 144 V128 Q55 119 62 128 V144 Z" fill="#7A4A26" stroke="#4A2E14" stroke-width="2.5"/>
