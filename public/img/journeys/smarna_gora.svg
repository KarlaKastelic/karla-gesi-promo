    <path d="M252 206 L242 238 M252 206 L262 238 M348 206 L338 238 M348 206 L358 238" fill="none" stroke="#4A2E14" stroke-width="9"/>
    <path d="M252 206 L242 238 M252 206 L262 238 M348 206 L338 238 M348 206 L358 238" fill="none" stroke="#A1662F" stroke-width="5"/>
