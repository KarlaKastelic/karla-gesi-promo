  <path d="M30 230 l4 -8 l4 8 M150 218 l4 -8 l4 8 M196 240 l4 -8 l4 8 M386 232 l4 -8 l4 8" fill="none" stroke="#4E9A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
