    <polygon points="260.9,101 268,92 280,101 276,99 272,103 268,99 264,103"/>
    <polygon points="290.4,96 300,84 313.5,96 309,93 305,98 300,93 295,98"/>
    <polygon points="362,109 372,104 380.9,109 377,108 373,111 369,108 365,110.5"/>
