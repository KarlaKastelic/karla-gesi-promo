<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="sv_jakob-sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="140">
      <stop offset="0" stop-color="#72B9EA"/>
      <stop offset="1" stop-color="#E2F1FB"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="400" height="250" fill="url(#sv_jakob-sky)"/>

  <!-- soft sun -->
  <circle cx="40" cy="38" r="28" fill="#FFF3C4" opacity="0.55"/>
  <circle cx="40" cy="38" r="17" fill="#F6C945" stroke="#D9A520" stroke-width="4"/>

  <!-- clouds -->
  <g transform="translate(118 30) scale(0.7)">
    <g fill="#FFFFFF" stroke="#9DB8CC" stroke-width="3.5">
      <circle cx="-22" cy="11" r="13"/>
      <circle cx="0" cy="0" r="17"/>
      <circle cx="22" cy="11" r="13"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="-22" cy="11" r="11"/>
      <circle cx="0" cy="0" r="15"/>
      <circle cx="22" cy="11" r="11"/>
      <rect x="-22" y="5" width="44" height="17"/>
    </g>
    <line x1="-34" y1="24" x2="34" y2="24" stroke="#9DB8CC" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(330 42) scale(0.85)">
    <g fill="#FFFFFF" stroke="#9DB8CC" stroke-width="3">
      <circle cx="-22" cy="11" r="13"/>
      <circle cx="0" cy="0" r="17"/>
      <circle cx="22" cy="11" r="13"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="-22" cy="11" r="11"/>
      <circle cx="0" cy="0" r="15"/>
      <circle cx="22" cy="11" r="11"/>
      <rect x="-22" y="5" width="44" height="17"/>
    </g>
    <line x1="-34" y1="24" x2="34" y2="24" stroke="#9DB8CC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- a paraglider far away -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M168 66 Q179 56 190 66 Q179 62 168 66 Z" fill="#FF7043" stroke="#9A3D1E" stroke-width="2"/>
    <path d="M169 66 L179 78 L189 66" fill="none" stroke="#6D5D55" stroke-width="1.2"/>
    <circle cx="179" cy="79" r="2.4" fill="#3F51B5"/>
  </g>

  <!-- Kamnik-Savinja Alps on the horizon -->
  <path d="M-4 134 V120 L20 112 L40 118 L62 94 L78 106 L96 84 L112 100 L130 90 L148 108 L170 98 L186 112 L210 106 L240 116 L270 112 L300 120 L340 116 L404 122 V134 Z" fill="#8EA8C6"/>
  <g fill="#7690B0">
    <polygon points="62,94 78,106 70,134 62,134"/>
    <polygon points="96,84 112,100 104,134 96,134"/>
    <polygon points="130,90 148,108 138,134 130,134"/>
    <polygon points="170,98 186,112 178,134 170,134"/>
  </g>
  <g fill="#FFFFFF" stroke="#9FB4CB" stroke-width="2" stroke-linejoin="round">
    <polygon points="54.3,102.4 62,94 67.6,98.2 65,97.5 62,101 59,98 56.5,101.5"/>
    <polygon points="88.8,92 96,84 102.4,89.6 99.5,89 96,93 92.5,89.5 90.5,92"/>
    <polygon points="122.8,94 130,90 137.2,97.2 134,95.5 130,98.5 127,95.5 124.5,96.5"/>
    <polygon points="161.2,102 170,98 176.4,103.6 173,102.5 170,105 167,102 164,103.5"/>
  </g>
  <polyline points="-4,120 20,112 40,118 62,94 78,106 96,84 112,100 130,90 148,108 170,98 186,112 210,106 240,116 270,112 300,120 340,116 404,122" fill="none" stroke="#4F6B88" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- the green Sora valley far below -->
  <path d="M-4 130 Q200 122 404 130 V214 H-4 Z" fill="#A8D48C"/>
  <path d="M-4 130 Q200 122 404 130" fill="none" stroke="#7FB46A" stroke-width="2.5"/>
  <g fill="#C3E3A6">
    <ellipse cx="40" cy="140" rx="30" ry="5"/>
    <ellipse cx="150" cy="150" rx="36" ry="5"/>
  </g>
  <ellipse cx="96" cy="164" rx="24" ry="4.5" fill="#D8E7A2"/>
  <!-- the Sora river -->
  <path d="M-4 176 Q50 160 104 158 Q150 156 196 142" fill="none" stroke="#7EC3E8" stroke-width="4" stroke-linecap="round"/>
  <!-- the little houses of Medvode -->
  <g stroke="#6D5D55" stroke-width="1.5" stroke-linejoin="round">
    <rect x="66" y="141" width="8" height="6" fill="#FFFFFF"/>
    <polygon points="64.5,141.5 70,137 75.5,141.5" fill="#D0643A"/>
    <rect x="80" y="144" width="8" height="6" fill="#FFFFFF"/>
    <polygon points="78.5,144.5 84,140 89.5,144.5" fill="#D0643A"/>
    <rect x="96" y="140" width="8" height="6" fill="#FFF3D6"/>
    <polygon points="94.5,140.5 100,136 105.5,140.5" fill="#D0643A"/>
    <rect x="112" y="146" width="8" height="6" fill="#FFFFFF"/>
    <polygon points="110.5,146.5 116,142 121.5,146.5" fill="#D0643A"/>
    <rect x="128" y="141" width="8" height="6" fill="#FFFFFF"/>
    <polygon points="126.5,141.5 132,137 137.5,141.5" fill="#D0643A"/>
  </g>
  <g fill="#5E9E4E">
    <ellipse cx="56" cy="152" rx="5" ry="3.5"/>
    <ellipse cx="146" cy="138" rx="4.5" ry="3"/>
    <ellipse cx="180" cy="152" rx="5" ry="3.5"/>
    <ellipse cx="24" cy="160" rx="4.5" ry="3"/>
  </g>

  <!-- the summit ridge -->
  <path d="M-4 210 Q110 192 190 160 Q250 134 320 128 Q370 126 404 130 V254 H-4 Z" fill="#5FA052" stroke="#3E7438" stroke-width="3" stroke-linejoin="round"/>

  <!-- trees round the church -->
  <g fill="#3F8F4A" stroke="#1E5631" stroke-width="3">
    <circle cx="214" cy="140" r="15"/>
    <circle cx="198" cy="152" r="13"/>
    <circle cx="384" cy="112" r="18"/>
    <circle cx="398" cy="128" r="14"/>
    <circle cx="370" cy="132" r="13"/>
  </g>
  <g fill="#4FA35A">
    <circle cx="209" cy="134" r="6"/>
    <circle cx="379" cy="106" r="7"/>
  </g>

  <!-- the church of St. James -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- apse -->
    <path d="M346 110 H362 Q374 112 374 124 V146 H346 Z" fill="#FBF6EC" stroke="#5B5550" stroke-width="3.5"/>
    <path d="M342 112 L350 98 H360 Q372 100 378 112 Z" fill="#A9472A" stroke="#5E2410" stroke-width="3.5"/>
    <!-- nave -->
    <rect x="258" y="104" width="92" height="44" fill="#FBF6EC" stroke="#5B5550" stroke-width="3.5"/>
    <!-- red-brown roof -->
    <polygon points="252,107 266,82 342,82 356,107" fill="#A9472A" stroke="#5E2410" stroke-width="3.5"/>
    <!-- arched windows -->
    <g fill="#A9CDE6" stroke="#5B5550" stroke-width="2.5">
      <path d="M276 134 V121 Q282 113 288 121 V134 Z"/>
      <path d="M314 134 V121 Q320 113 326 121 V134 Z"/>
    </g>
    <!-- slender bell tower -->
    <rect x="232" y="62" width="28" height="88" fill="#FBF6EC" stroke="#5B5550" stroke-width="3.5"/>
    <rect x="228" y="60" width="36" height="6" rx="2" fill="#E6DED0" stroke="#5B5550" stroke-width="3"/>
    <path d="M240 86 V77 Q246 69 252 77 V86 Z" fill="#5B4636" stroke="#3E2F24" stroke-width="2.5"/>
    <circle cx="246" cy="82" r="3" fill="#E0A820"/>
    <!-- tall pointed spire -->
    <polygon points="230,61 246,12 262,61" fill="#55616C" stroke="#2F3A44" stroke-width="3.5"/>
    <path d="M246 12 V3 M242.5 6.5 H249.5" fill="none" stroke="#2F3A44" stroke-width="2.5"/>
    <!-- tower door -->
    <path d="M239 150 V134 Q246 125 253 134 V150 Z" fill="#7A4A26" stroke="#4A2E14" stroke-width="2.5"/>
  </g>

  <!-- the summit meadow in front -->
  <path d="M-4 206 Q120 190 230 196 Q320 200 404 190 V254 H-4 Z" fill="#7CC36B" stroke="#5DA34E" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 234 l4 -8 l4 8 M248 226 l4 -8 l4 8 M330 240 l4 -8 l4 8 M380 214 l4 -8 l4 8" fill="none" stroke="#4E9A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#C9A100" stroke-width="1.5">
    <circle cx="276" cy="212" r="3.5" fill="#FFFFFF"/>
    <circle cx="300" cy="236" r="3.5" fill="#FFE082"/>
    <circle cx="352" cy="220" r="3.5" fill="#FFFFFF"/>
    <circle cx="24" cy="216" r="3.5" fill="#FFE082"/>
  </g>

  <!-- wooden bench -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="140" cy="242" rx="84" ry="6" fill="#6BB35C"/>
    <!-- back posts and legs -->
    <path d="M84 180 V242 M196 180 V242" fill="none" stroke="#4A2E14" stroke-width="9"/>
    <path d="M84 180 V242 M196 180 V242" fill="none" stroke="#A1662F" stroke-width="5"/>
    <!-- backrest boards -->
    <rect x="68" y="178" width="144" height="10" rx="2" fill="#B5763A" stroke="#5A3414" stroke-width="3"/>
    <rect x="68" y="194" width="144" height="10" rx="2" fill="#B5763A" stroke="#5A3414" stroke-width="3"/>
  </g>

  <!-- orange rucksack -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M96 182 Q103 170 110 182" fill="none" stroke="#7A2E10" stroke-width="4"/>
    <rect x="86" y="180" width="34" height="34" rx="10" fill="#F07A3A" stroke="#7A2E10" stroke-width="3.5"/>
    <path d="M87 191 Q103 185 119 191 L119 195 Q103 190 87 195 Z" fill="#D25A22" stroke="#7A2E10" stroke-width="2.5"/>
    <rect x="93" y="199" width="20" height="11" rx="3" fill="#F7A06A" stroke="#7A2E10" stroke-width="2.5"/>
  </g>

  <!-- water bottle -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="141" y="181" width="8" height="8" rx="2" fill="#37474F" stroke="#1C262B" stroke-width="2.5"/>
    <rect x="137" y="188" width="16" height="26" rx="5" fill="#4FA3E0" stroke="#1F5F8B" stroke-width="3"/>
    <path d="M142 194 V207" fill="none" stroke="#B3DDF7" stroke-width="2.5"/>
  </g>

  <!-- an apple -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M176 200 Q176 194 180 190" fill="none" stroke="#5A3414" stroke-width="3"/>
    <ellipse cx="185" cy="193" rx="6" ry="3" transform="rotate(-25 185 193)" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/>
    <path d="M176 200 Q169 194 164 200 Q159 207 164 212 Q169 216 176 213 Q183 216 188 212 Q193 207 188 200 Q183 194 176 200 Z" fill="#E53935" stroke="#8E1F1B" stroke-width="3"/>
    <path d="M168 203 Q167 207 169 209" fill="none" stroke="#F28B82" stroke-width="2.5"/>
  </g>

  <!-- the bench seat in front -->
  <rect x="62" y="212" width="156" height="9" rx="2" fill="#C68A4A" stroke="#5A3414" stroke-width="3" stroke-linejoin="round"/>
</svg>
