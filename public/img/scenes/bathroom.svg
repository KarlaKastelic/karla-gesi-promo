    <line x1="408" y1="216" x2="474" y2="216" stroke="#546E7A" stroke-width="3"/>
    <rect x="414" y="202" width="22" height="8" rx="2" fill="#B0BEC5"/>
    <circle cx="462" cy="206" r="5" fill="#90A4AE" stroke="#546E7A" stroke-width="2.5"/>
    <circle cx="448" cy="206" r="3" fill="#66BB6A"/>
    <circle cx="441" cy="256" r="26" fill="#CFD8DC" stroke="#546E7A" stroke-width="4.5"/>
    <circle cx="441" cy="256" r="18" fill="#81D4FA" stroke="#546E7A" stroke-width="3"/>
    <path d="M425 260 Q433 252 441 260 Q449 268 457 258 V264 Q449 276 441 274 Q429 274 425 264 Z" fill="#4FA3E0"/>
  </g>
