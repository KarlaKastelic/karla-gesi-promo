    <line x1="0" y1="224" x2="480" y2="224"/><line x1="0" y1="256" x2="480" y2="256"/>
    <line x1="32" y1="0" x2="32" y2="292"/><line x1="64" y1="0" x2="64" y2="292"/><line x1="96" y1="0" x2="96" y2="292"/>
    <line x1="128" y1="0" x2="128" y2="292"/><line x1="160" y1="0" x2="160" y2="292"/><line x1="192" y1="0" x2="192" y2="292"/>
    <line x1="224" y1="0" x2="224" y2="292"/><line x1="256" y1="0" x2="256" y2="292"/><line x1="288" y1="0" x2="288" y2="292"/>
    <line x1="320" y1="0" x2="320" y2="292"/><line x1="352" y1="0" x2="352" y2="292"/><line x1="384" y1="0" x2="384" y2="292"/>
