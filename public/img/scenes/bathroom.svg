    <path d="M347 190 V168 Q347 156 359 156 Q371 156 371 168 V176" fill="none" stroke="#546E7A" stroke-width="11"/>
    <path d="M347 190 V168 Q347 156 359 156 Q371 156 371 168 V176" fill="none" stroke="#E0E0E0" stroke-width="5"/>
