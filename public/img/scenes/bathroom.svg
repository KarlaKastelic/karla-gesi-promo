    <path d="M190 84 Q222 78 254 84 L258 168 Q222 176 186 168 Z" fill="#FF8A65" stroke="#BF360C" stroke-width="4"/>
    <path d="M190 84 Q222 78 254 84 L255 108 Q222 102 189 108 Z" fill="#FFAB91" stroke="#BF360C" stroke-width="3"/>
