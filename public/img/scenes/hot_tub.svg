    <circle cx="56" cy="180" r="30" fill="url(#ht-glow)"/>
    <rect x="40" y="164" width="32" height="30" fill="#FFD54F" stroke="#4E2E18" stroke-width="3"/>
    <path d="M56 164 V194 M40 179 H72" stroke="#4E2E18" stroke-width="2.5"/>
    <rect x="90" y="172" width="24" height="46" fill="#6B4127" stroke="#4E2E18" stroke-width="3"/>
    <circle cx="109" cy="196" r="2" fill="#FFD54F"/>
    <path d="M4 144 L72 98 L140 144 Z" fill="#5D3A22" stroke="#3E2410" stroke-width="3"/>
    <path d="M4 144 L72 96 L140 144 Q130 150 118 143 Q104 150 92 142 Q78 150 64 142 Q50 150 36 142 Q22 150 4 144 Z" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="2"/>
    <rect x="96" y="104" width="14" height="22" fill="#7A4A2E" stroke="#3E2410" stroke-width="2.5"/>
    <path d="M94 104 Q103 98 112 104" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="2"/>
    <path d="M20 218 Q40 212 60 218 Q90 212 128 218" fill="#FFFFFF" stroke="#B9CCE4" stroke-width="2"/>
