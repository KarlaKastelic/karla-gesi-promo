<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="ht-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#2A4A78"/>
    </linearGradient>
    <linearGradient id="ht-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD8F7"/>
      <stop offset="1" stop-color="#29A3D9"/>
    </linearGradient>
    <radialGradient id="ht-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE082" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFE082" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night sky, distant snowy hills and the snow on the ground (not parts) -->
  <rect x="0" y="0" width="480" height="230" fill="url(#ht-sky)"/>
  <path d="M0 200 Q60 170 130 188 Q200 160 280 182 Q360 158 480 186 V230 H0 Z" fill="#C9D8EC"/>
  <rect x="0" y="212" width="480" height="148" fill="#EEF4FB"/>
  <path d="M0 212 Q120 204 240 212 Q360 204 480 212" fill="none" stroke="#D5E2F2" stroke-width="3"/>

  <!-- the moon: a big friendly crescent -->
  <g data-part="moon">
    <circle cx="395" cy="52" r="34" fill="url(#ht-glow)"/>
    <path d="M404 24 A28 28 0 1 0 412 76 A22 22 0 1 1 404 24 Z" fill="#FFF3B0" stroke="#E6C65C" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- the stars -->
  <g data-part="stars" fill="#FFF8D6" stroke="#F2D46B" stroke-width="1" stroke-linejoin="round">
    <g transform="translate(38 34)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
    <g transform="translate(108 66)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/></g>
    <g transform="translate(172 24)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/></g>
    <g transform="translate(246 52)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/></g>
    <g transform="translate(312 20)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
    <g transform="translate(456 22)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/></g>
    <g transform="translate(206 100)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/></g>
    <g transform="translate(340 92)"><circle r="10" fill="transparent" stroke="none"/><path d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/></g>
    <g fill="#FFF8D6" stroke="none"><circle cx="76" cy="18" r="1.6"/><circle cx="140" cy="44" r="1.4"/><circle cx="278" cy="34" r="1.6"/><circle cx="360" cy="14" r="1.4"/><circle cx="20" cy="80" r="1.4"/><circle cx="440" cy="104" r="1.6"/></g>
