        <path d="M-12 -36 Q8 -36 24 -24 M-34 0 Q-38 -24 -26 -34" fill="none" stroke="#D4A63A" stroke-width="2.5"/>
        <path d="M-2 -13 Q4 -18 10 -15 M18 -15 Q23 -18 28 -13" fill="none" stroke="#9C6B30" stroke-width="3.5"/>
        <circle cx="4" cy="0" r="5.5" fill="#8A9BA8"/>
        <circle cx="22" cy="0" r="5.5" fill="#8A9BA8"/>
        <circle cx="4" cy="0" r="2.6" fill="#1B1B1B"/>
        <circle cx="22" cy="0" r="2.6" fill="#1B1B1B"/>
        <circle cx="5.4" cy="-1.6" r="1.1" fill="#FFFFFF"/>
        <circle cx="23.4" cy="-1.6" r="1.1" fill="#FFFFFF"/>
        <path d="M-3 -1 Q4 -9 11 -2 M15 -2 Q22 -9 29 -1 M-3 -1 L-7 -5" fill="none" stroke="#3E2723" stroke-width="3.5"/>
        <path d="M16 6 Q19 12 14 14" fill="none" stroke="#B07A50" stroke-width="3.5"/>
        <ellipse cx="-4" cy="15" rx="7" ry="4.5" fill="#F48FB1" opacity="0.7"/>
        <ellipse cx="28" cy="14" rx="4.5" ry="4" fill="#F48FB1" opacity="0.7"/>
        <path d="M2 20 Q14 24 28 18 Q26 32 14 32 Q4 31 2 20 Z" fill="#D9566B" stroke="#9C2F45" stroke-width="2.5"/>
        <path d="M4 21 Q14 25 27 19.5 L26 23 Q14 28 5 24.5 Z" fill="#FFFFFF"/>
