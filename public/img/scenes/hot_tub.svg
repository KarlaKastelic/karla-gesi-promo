        <path d="M-2 -14 Q4 -19 11 -15 M16 -15 Q22 -19 29 -14" fill="none" stroke="#4E342E" stroke-width="4"/>
        <path d="M16 5 V13" stroke="#B07A50" stroke-width="4"/>
        <ellipse cx="-4" cy="16" rx="6" ry="4" fill="#F48FB1" opacity="0.45"/>
        <path d="M-2 18 Q14 22 32 16 Q30 36 14 36 Q0 34 -2 18 Z" fill="#8D4A3A" stroke="#6D3325" stroke-width="3"/>
        <path d="M0 19 Q14 23 31 17 L30 22 Q14 27 1 24 Z" fill="#FFFFFF"/>
