      <path d="M-11 220 Q-12 240 0 244 Q12 240 11 220 Z" fill="#EAF6FB" fill-opacity="0.6" stroke="#5F7D8C" stroke-width="2"/>
      <path d="M-10.5 230 Q-10 241 0 243.5 Q10 241 10.5 230 Z" fill="#F4E27A" stroke="none"/>
      <path d="M-10.5 230 H10.5" stroke="#D9C24A" stroke-width="1.5"/>
      <path d="M0 244 V258" stroke="#5F7D8C" stroke-width="2.5"/>
      <ellipse cx="0" cy="259" rx="8" ry="2.6" fill="#EAF6FB" stroke="#5F7D8C" stroke-width="2"/>
      <path d="M-7 223 Q-8 232 -5 238" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- warm steam rising off the water -->
  <g data-part="steam" fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.6">
    <path d="M100 230 Q90 212 102 196 Q114 180 104 162" stroke-width="7"/>
    <path d="M242 226 Q232 210 244 194 Q254 178 244 160" stroke-width="7"/>
    <path d="M384 230 Q394 212 382 196 Q370 180 380 162" stroke-width="7"/>
