    <g transform="translate(436 0)">
      <rect x="-6" y="214" width="12" height="22" fill="#6D4223" stroke="#3E2410" stroke-width="2.5"/>
      <path d="M0 92 L28 140 L14 140 L36 180 L18 180 L42 218 L-42 218 L-18 180 L-36 180 L-14 140 L-28 140 Z" fill="#2E7D4F" stroke="#1B4D30" stroke-width="3"/>
      <path d="M0 92 L12 112 Q0 106 -12 112 Z M-16 140 Q0 132 16 140 L22 148 Q0 140 -22 148 Z M-20 180 Q0 172 20 180 L28 190 Q0 180 -28 190 Z M-38 214 Q0 206 38 214 L42 218 L-42 218 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- the hot tub: wooden sides, a wide wooden rim and the bubbling water -->
  <g data-part="hot_tub" stroke-linejoin="round">
    <rect x="76" y="250" width="328" height="80" fill="#9C6038" stroke="#5A3218" stroke-width="3"/>
    <g stroke="#7A4626" stroke-width="2"><line x1="108" y1="268" x2="108" y2="330"/><line x1="140" y1="268" x2="140" y2="330"/><line x1="172" y1="268" x2="172" y2="330"/><line x1="204" y1="268" x2="204" y2="330"/><line x1="236" y1="268" x2="236" y2="330"/><line x1="268" y1="268" x2="268" y2="330"/><line x1="300" y1="268" x2="300" y2="330"/><line x1="332" y1="268" x2="332" y2="330"/><line x1="364" y1="268" x2="364" y2="330"/></g>
    <rect x="66" y="196" width="348" height="74" rx="24" fill="#C08552" stroke="#5A3218" stroke-width="3"/>
    <rect x="82" y="207" width="316" height="51" rx="16" fill="#1F7FB5" stroke="#5A3218" stroke-width="2.5"/>
