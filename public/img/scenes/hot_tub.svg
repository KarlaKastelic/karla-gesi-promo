        <ellipse cx="-19" cy="8" rx="6.5" ry="9" fill="#F2C9A0" stroke="#B07A50" stroke-width="3.5"/>
        <circle cx="-19" cy="23" r="5" fill="#FFC93C" stroke="#B8860B" stroke-width="2.5"/>
