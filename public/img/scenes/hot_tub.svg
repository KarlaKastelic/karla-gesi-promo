    <g fill="#FFD54F" stroke="#B8860B" stroke-width="1.5" transform="translate(28 -4)">
      <ellipse cx="410" cy="262" rx="4.5" ry="3.5"/>
      <path d="M414 262 V246 L420 249" fill="none" stroke="#FFD54F" stroke-width="2.5"/>
      <ellipse cx="400" cy="240" rx="4" ry="3"/><ellipse cx="410" cy="236" rx="4" ry="3"/>
      <path d="M403.5 240 V226 L413.5 222 V236" fill="none" stroke="#FFD54F" stroke-width="2.5"/>
    </g>
    <rect x="422" y="214" width="30" height="50" fill="transparent"/>
