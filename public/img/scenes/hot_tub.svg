    <rect x="420" y="264" width="50" height="31" rx="6" fill="#D84343" stroke="#7F1414" stroke-width="2.5"/>
    <circle cx="436" cy="280" r="10" fill="#F5E6C8" stroke="#7F1414" stroke-width="2"/>
    <g stroke="#B08A5A" stroke-width="1.5"><line x1="429" y1="276" x2="443" y2="276"/><line x1="428" y1="280" x2="444" y2="280"/><line x1="429" y1="284" x2="443" y2="284"/></g>
    <rect x="451" y="271" width="14" height="8" rx="1.5" fill="#FFF3B0" stroke="#7F1414" stroke-width="1.5"/>
    <path d="M455 271 V279" stroke="#C62828" stroke-width="1.5"/>
    <circle cx="455" cy="287" r="3" fill="#3B3B3B"/>
    <circle cx="463" cy="287" r="3" fill="#3B3B3B"/>
