  <!-- snowflakes falling all over -->
  <g data-part="snowflakes" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
    <g transform="translate(66 52)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(136 96) rotate(15)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(212 66)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(278 84) rotate(20)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(350 54)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(456 70) rotate(10)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(30 116)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(372 132) rotate(25)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(152 118) rotate(5)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(26 262)" stroke="#9FB7D6"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(36 316) rotate(20)" stroke="#9FB7D6"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
    <g transform="translate(240 352) rotate(10)" stroke="#9FB7D6"><circle r="7" fill="transparent" stroke="none"/><path d="M0 -5 V5 M-4.3 -2.5 L4.3 2.5 M-4.3 2.5 L4.3 -2.5"/></g>
    <g transform="translate(456 352)" stroke="#9FB7D6"><circle r="7" fill="transparent" stroke="none"/><path d="M0 -5 V5 M-4.3 -2.5 L4.3 2.5 M-4.3 2.5 L4.3 -2.5"/></g>
    <g transform="translate(404 118) rotate(30)"><circle r="9" fill="transparent" stroke="none"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/></g>
