      <rect x="-7" y="188" width="14" height="18" fill="#F2C9A0" stroke="#B07A50" stroke-width="2.5"/>
      <!-- head, as in the other family pictures -->
      <g transform="translate(0 162) scale(0.95)">
        <path d="M22 -36 Q4 -50 -18 -46 Q-46 -36 -46 0 Q-48 30 -42 54 Q-30 62 -14 54 Q-16 36 -14 20 L20 -10 Z M30 -24 Q44 6 38 42 Q32 50 24 44 Q30 20 28 0 Z" fill="#F2C94C" stroke="#B8902A" stroke-width="4"/>
