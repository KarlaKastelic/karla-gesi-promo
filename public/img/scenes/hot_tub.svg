    <g fill="#FFFFFF" stroke="#9ADCF5" stroke-width="1"><circle cx="110" cy="246" r="3.5"/><circle cx="122" cy="250" r="2.2"/><circle cx="160" cy="244" r="2.8"/><circle cx="236" cy="248" r="3.6"/><circle cx="248" cy="243" r="2.2"/><circle cx="226" cy="252" r="2"/><circle cx="356" cy="246" r="3.2"/><circle cx="370" cy="251" r="2.2"/><circle cx="300" cy="252" r="2.6"/><circle cx="196" cy="250" r="2.2"/></g>
