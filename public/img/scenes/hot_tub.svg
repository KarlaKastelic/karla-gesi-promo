      <path d="M-48 250 Q-50 210 -26 202 Q0 196 26 202 Q50 210 48 250 Z" fill="#F2C9A0" stroke="#B07A50" stroke-width="2.6"/>
      <path d="M-14 222 Q-6 226 -2 220 M14 222 Q6 226 2 220" fill="none" stroke="#B07A50" stroke-width="2"/>
