<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="wu-dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD3F2"/>
      <stop offset="0.55" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#FFB37A"/>
    </linearGradient>
  </defs>

  <!-- soft morning wall and a wooden floor (not parts) -->
  <rect x="0" y="0" width="480" height="292" fill="#F6E7D3"/>
  <rect x="0" y="292" width="480" height="68" fill="#C99A6B"/>
  <g stroke="#B5845A" stroke-width="2"><line x1="0" y1="312" x2="480" y2="312"/><line x1="0" y1="334" x2="480" y2="334"/></g>
  <!-- morning light falling in from the window -->
  <path d="M22 140 L102 140 L200 292 L60 292 Z" fill="#FFF3D6" opacity="0.6"/>

  <!-- the window: early morning, the sun just coming up -->
  <g data-part="window" stroke-linejoin="round">
    <rect x="22" y="40" width="80" height="100" fill="url(#wu-dawn)" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M26 122 Q46 110 66 118 Q84 108 98 116 V136 H26 Z" fill="#7CB46B"/>
    <path d="M62 40 V140 M22 90 H102" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="22" y="40" width="80" height="100" fill="none" stroke="#C9B49A" stroke-width="2"/>
    <rect x="16" y="140" width="92" height="7" fill="#FFFFFF" stroke="#C9B49A" stroke-width="2"/>
  </g>
  <!-- the sun rising over the hills -->
  <g data-part="sun">
    <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"><line x1="44" y1="112" x2="38" y2="106"/><line x1="44" y1="100" x2="44" y2="96" transform="rotate(-30 44 118)"/><line x1="44" y1="100" x2="44" y2="96" transform="rotate(30 44 118)"/><line x1="56" y1="112" x2="61" y2="106" transform="translate(-6 0)"/></g>
    <path d="M30 120 A14 14 0 0 1 58 120 Z" fill="#FFC93C" stroke="#E08A0B" stroke-width="2"/>
    <rect x="26" y="96" width="34" height="26" fill="transparent"/>
  </g>
  <!-- curtains pulled to both sides -->
  <g data-part="curtains" stroke="#B85C5C" stroke-width="2" stroke-linejoin="round">
    <rect x="8" y="28" width="108" height="5" rx="2.5" fill="#8D6E63" stroke="#5D4037"/>
    <path d="M10 33 H30 Q26 90 34 160 H8 Q14 90 10 33 Z" fill="#F4A6A6"/>
    <path d="M94 33 H114 Q110 90 116 160 H90 Q98 90 94 33 Z" fill="#F4A6A6"/>
    <path d="M18 40 Q16 100 20 156 M104 40 Q102 100 106 156" fill="none" stroke="#E08B8B"/>
  </g>

  <!-- a picture on the wall: mountains -->
  <g data-part="picture" stroke-linejoin="round">
    <rect x="234" y="58" width="72" height="52" fill="#B9E2F5" stroke="#8D5A3B" stroke-width="5"/>
    <path d="M238 106 L258 78 L270 92 L282 72 L302 106 Z" fill="#6B8E9E" stroke="#4A6572" stroke-width="2"/>
    <path d="M282 72 L288 82 L282 80 L277 83 Z M258 78 L263 85 L258 84 L254 86 Z" fill="#FFFFFF"/>
    <circle cx="292" cy="70" r="5" fill="#FFD54F"/>
  </g>

  <!-- the bedside table, with the lamp and the alarm clock on it -->
  <g data-part="bedside_table" stroke-linejoin="round">
    <rect x="20" y="232" width="78" height="62" fill="#B07A4E" stroke="#5A3218" stroke-width="3"/>
    <rect x="16" y="226" width="86" height="9" rx="2" fill="#C08552" stroke="#5A3218" stroke-width="3"/>
    <rect x="28" y="244" width="62" height="20" fill="#C08552" stroke="#5A3218" stroke-width="2.5"/>
    <circle cx="59" cy="254" r="3" fill="#5A3218"/>
    <rect x="24" y="292" width="8" height="10" fill="#5A3218"/><rect x="86" y="292" width="8" height="10" fill="#5A3218"/>
  </g>
  <g data-part="lamp" stroke-linejoin="round">
    <ellipse cx="40" cy="225" rx="12" ry="3.5" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
    <rect x="37.5" y="194" width="5" height="31" fill="#8D6E63" stroke="#4E342E" stroke-width="1.5"/>
    <path d="M24 196 L30 170 L50 170 L56 196 Z" fill="#FFF1C4" stroke="#C9A24A" stroke-width="2.5"/>
  </g>
  <!-- the alarm clock: six o'clock -->
  <g data-part="alarm_clock" stroke-linejoin="round" stroke-linecap="round">
    <path d="M66 226 L62 230 M86 226 L90 230" stroke="#3B3B3B" stroke-width="3"/>
    <circle cx="66" cy="202" r="5" fill="#E53935" stroke="#7F1414" stroke-width="2"/>
    <circle cx="86" cy="202" r="5" fill="#E53935" stroke="#7F1414" stroke-width="2"/>
    <circle cx="76" cy="213" r="13" fill="#E53935" stroke="#7F1414" stroke-width="2.5"/>
    <circle cx="76" cy="213" r="9.5" fill="#FFFFFF" stroke="#7F1414" stroke-width="1.5"/>
    <path d="M76 213 V205.5 M76 213 V219" stroke="#1B1B1B" stroke-width="2"/>
    <circle cx="76" cy="213" r="1.4" fill="#1B1B1B"/>
  </g>

  <!-- a rug and slippers in front of the bed -->
  <g data-part="rug">
    <ellipse cx="270" cy="344" rx="160" ry="14" fill="#9C7CC0" stroke="#6A4C8C" stroke-width="2.5"/>
    <ellipse cx="270" cy="344" rx="140" ry="9" fill="none" stroke="#C5B0DE" stroke-width="2" stroke-dasharray="6 5"/>
  </g>

  <!-- the bed: headboard, frame, pillows and the big duvet -->
  <g data-part="bed" stroke-linejoin="round">
    <path d="M106 220 V150 Q106 126 130 126 L414 126 Q438 126 438 150 V220 Z" fill="#B07A4E" stroke="#5A3218" stroke-width="3"/>
    <path d="M122 214 V156 Q122 140 138 140 L406 140 Q422 140 422 156 V214" fill="none" stroke="#8D5A3B" stroke-width="3"/>
    <rect x="94" y="302" width="356" height="24" rx="4" fill="#B07A4E" stroke="#5A3218" stroke-width="3"/>
    <rect x="102" y="324" width="10" height="18" fill="#8D5A3B" stroke="#5A3218" stroke-width="2.5"/>
    <rect x="432" y="324" width="10" height="18" fill="#8D5A3B" stroke="#5A3218" stroke-width="2.5"/>
  </g>
  <g data-part="pillow" stroke-linejoin="round">
    <path d="M162 176 Q200 168 240 176 Q246 198 240 222 L162 222 Q156 198 162 176 Z" fill="#FFFFFF" stroke="#9FB2BF" stroke-width="2.5"/>
    <path d="M256 176 Q296 168 336 176 Q342 198 336 222 L256 222 Q250 198 256 176 Z" fill="#FFFFFF" stroke="#9FB2BF" stroke-width="2.5"/>
  </g>

  <!-- Karla asleep: blond hair spread on the pillow, eyes shut, a little smile -->
  <g data-part="karla" transform="translate(0 -7)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 200 Q164 170 200 166 Q236 170 232 200 Q236 216 222 220 L178 220 Q164 216 168 200 Z" fill="#F2C94C" stroke="#B8902A" stroke-width="2.5"/>
    <ellipse cx="200" cy="200" rx="18" ry="21" fill="#F2C9A0" stroke="#B07A50" stroke-width="2.5"/>
    <path d="M182 196 Q180 176 200 176 Q220 176 218 194 Q214 184 204 184 Q196 186 192 192 Q188 188 182 196 Z" fill="#F2C94C" stroke="#B8902A" stroke-width="2"/>
    <path d="M187 200 Q191 204 195 200 M205 200 Q209 204 213 200" fill="none" stroke="#3E2723" stroke-width="2.2"/>
    <path d="M187 200 L185 202 M213 200 L215 202" fill="none" stroke="#3E2723" stroke-width="1.5"/>
    <ellipse cx="188" cy="208" rx="4" ry="2.5" fill="#F48FB1" opacity="0.7"/>
    <ellipse cx="212" cy="208" rx="4" ry="2.5" fill="#F48FB1" opacity="0.7"/>
    <path d="M200 202 Q202 206 199 207" fill="none" stroke="#B07A50" stroke-width="1.8"/>
    <path d="M195 212 Q200 215 205 212" fill="none" stroke="#9C2F45" stroke-width="2"/>
    <!-- still fast asleep: z z z -->
    <g fill="none" stroke="#5C8DC4" stroke-width="2.2">
      <path d="M222 168 H229 L222 175 H229"/>
      <path d="M232 154 H241 L232 163 H241"/>
      <path d="M244 136 H255 L244 147 H255"/>
    </g>
    <rect x="218" y="132" width="40" height="46" fill="transparent"/>
  </g>

  <!-- Bojan asleep: brown hair, eyes shut, mouth open a little -->
  <g data-part="bojan" transform="translate(0 -7)" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="296" cy="199" rx="19" ry="22" fill="#F2C9A0" stroke="#B07A50" stroke-width="2.5"/>
    <ellipse cx="277" cy="201" rx="3.5" ry="5.5" fill="#F2C9A0" stroke="#B07A50" stroke-width="2"/>
    <ellipse cx="315" cy="201" rx="3.5" ry="5.5" fill="#F2C9A0" stroke="#B07A50" stroke-width="2"/>
    <path d="M277 194 Q274 174 296 174 Q318 174 315 194 Q312 184 300 183 Q290 186 284 184 Q279 186 277 194 Z" fill="#2B211C" stroke="#17110E" stroke-width="2.2"/>
    <path d="M285 191 Q289 189 293 191 M299 191 Q303 189 307 191" fill="none" stroke="#4E342E" stroke-width="2.4"/>
    <path d="M284 199 Q288 203 292 199 M300 199 Q304 203 308 199" fill="none" stroke="#3E2723" stroke-width="2.2"/>
    <path d="M296 201 V207 Q298 208 297 209" fill="none" stroke="#B07A50" stroke-width="1.8"/>
    <ellipse cx="296" cy="214" rx="4" ry="3.2" fill="#8D4A3A" stroke="#6D3325" stroke-width="1.6"/>
  </g>

  <!-- the duvet over them both, with a white sheet folded over the top -->
  <g data-part="duvet" stroke-linejoin="round">
    <path d="M108 216 Q160 208 200 216 Q250 222 296 216 Q350 208 436 216 L446 296 Q446 306 434 306 L110 306 Q98 306 98 296 Z" fill="#8FBCE6" stroke="#3F6E9A" stroke-width="3"/>
    <path d="M108 216 Q160 208 200 216 Q250 222 296 216 Q350 208 436 216 L437 230 Q350 222 296 230 Q250 236 200 230 Q160 222 107 230 Z" fill="#FFFFFF" stroke="#9FB2BF" stroke-width="2"/>
    <g fill="#FFFFFF" opacity="0.7"><circle cx="140" cy="252" r="3"/><circle cx="180" cy="276" r="3"/><circle cx="226" cy="250" r="3"/><circle cx="268" cy="282" r="3"/><circle cx="312" cy="256" r="3"/><circle cx="160" cy="292" r="3"/><circle cx="246" cy="296" r="3"/><circle cx="130" cy="280" r="3"/><circle cx="410" cy="292" r="3"/><circle cx="352" cy="290" r="3"/></g>
    <path d="M150 300 Q170 250 200 236 M250 300 Q270 260 300 238" fill="none" stroke="#6E9CC8" stroke-width="2.5"/>
  </g>

  <!-- slippers waiting on the rug -->
  <g data-part="slippers" stroke-linejoin="round">
    <ellipse cx="160" cy="344" rx="14" ry="6" fill="#F48FB1" stroke="#AD3F6A" stroke-width="2"/>
    <ellipse cx="190" cy="347" rx="14" ry="6" fill="#F48FB1" stroke="#AD3F6A" stroke-width="2"/>
    <path d="M150 342 Q156 336 162 342 M180 345 Q186 339 192 345" fill="#FFFFFF" stroke="#AD3F6A" stroke-width="2"/>
  </g>

  <!-- Sanchi, the black boxer, up on the bed with his nose right at Bojan's face -->
  <g data-part="dog" stroke-linecap="round" stroke-linejoin="round" transform="translate(409 258) scale(-0.9 0.9)">
    <!-- far legs -->
    <path d="M18 -48 L25 -26 L19 -5 M60 -40 L59 -5" fill="none" stroke="#000000" stroke-width="15"/>
    <path d="M18 -48 L25 -26 L19 -5 M60 -40 L59 -5" fill="none" stroke="#1C1C1C" stroke-width="10.5"/>
    <!-- short tail stub, up and wagging -->
    <path d="M9 -64 L2 -76" fill="none" stroke="#000000" stroke-width="11"/>
    <path d="M9 -64 L2 -76" fill="none" stroke="#2B2B2B" stroke-width="7"/>
    <path d="M-6 -82 Q-10 -76 -6 -70 M-12 -86 Q-18 -76 -12 -66" fill="none" stroke="#5A5A5A" stroke-width="2"/>
    <!-- square, muscular body -->
    <path d="M8 -60 Q8 -73 24 -73 L56 -75 Q75 -75 79 -58 Q81 -40 69 -32 Q57 -31 46 -40 Q34 -45 26 -41 Q12 -38 8 -48 Z" fill="#2B2B2B" stroke="#000000" stroke-width="3.5"/>
    <path d="M18 -68 Q36 -72 54 -71 M44 -42 Q36 -46 30 -44" fill="none" stroke="#4A4A4A" stroke-width="2.5"/>
    <!-- near hind leg -->
    <path d="M20 -56 Q35 -58 35 -44 Q35 -36 29 -30 L33 -5" fill="none" stroke="#000000" stroke-width="19"/>
    <path d="M20 -56 Q35 -58 35 -44 Q35 -36 29 -30 L33 -5" fill="none" stroke="#2B2B2B" stroke-width="14"/>
    <!-- near front leg -->
    <path d="M70 -46 L71 -5" fill="none" stroke="#000000" stroke-width="17"/>
    <path d="M70 -46 L71 -5" fill="none" stroke="#2B2B2B" stroke-width="12.5"/>
    <!-- white paws -->
    <g fill="#F5F5F5" stroke="#000000" stroke-width="2.2">
      <ellipse cx="22" cy="-3" rx="7" ry="4"/>
      <ellipse cx="62" cy="-3" rx="7" ry="4"/>
      <ellipse cx="36" cy="-3" rx="8" ry="4.5"/>
      <ellipse cx="74" cy="-3" rx="8" ry="4.5"/>
    </g>
    <!-- thick neck, reaching forward and down -->
    <path d="M62 -62 Q74 -66 84 -62" fill="none" stroke="#000000" stroke-width="28"/>
    <path d="M62 -62 Q74 -66 84 -62" fill="none" stroke="#2B2B2B" stroke-width="22"/>
    <!-- white mark on his chest -->
    <path d="M74 -50 Q82 -48 80 -36 Q77 -28 72 -34 Q70 -42 74 -50 Z" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <!-- red collar -->
    <path d="M64 -76 L70 -50" fill="none" stroke="#E53935" stroke-width="6"/>
    <circle cx="69" cy="-54" r="2.8" fill="#FFD54F" stroke="#B8860B" stroke-width="1"/>
    <!-- head lowered to Bojan, turned to the viewer -->
    <g transform="translate(6 32)">
      <path d="M62 -104 Q62 -125 82 -125 Q102 -125 102 -104 L102 -96 Q102 -86 92 -84 L72 -84 Q62 -86 62 -96 Z" fill="#2B2B2B" stroke="#000000" stroke-width="3.5"/>
      <g fill="#1A1A1A" stroke="#000000" stroke-width="2.5">
        <path d="M67 -121 Q56 -122 54 -109 Q60 -106 68 -113 Z"/>
        <path d="M97 -121 Q108 -122 110 -109 Q104 -106 96 -113 Z"/>
      </g>
      <path d="M66 -120 Q58 -120 56 -112 M98 -120 Q106 -120 108 -112" fill="none" stroke="#5A5A5A" stroke-width="1.8"/>
      <path d="M73 -119 Q82 -122 91 -119 M79 -115 Q81 -111 79 -108 M85 -115 Q83 -111 85 -108" fill="none" stroke="#6A6A6A" stroke-width="2"/>
      <g fill="#3A3A3A"><circle cx="72" cy="-105" r="6.5"/><circle cx="92" cy="-105" r="6.5"/></g>
      <g stroke="#7A7A7A" stroke-width="1.5"><circle cx="72" cy="-105" r="4.2" fill="#6D4C41"/><circle cx="92" cy="-105" r="4.2" fill="#6D4C41"/></g>
      <circle cx="72" cy="-105" r="2.2" fill="#000000"/>
      <circle cx="92" cy="-105" r="2.2" fill="#000000"/>
      <circle cx="73.3" cy="-106.4" r="1.1" fill="#FFFFFF"/>
      <circle cx="93.3" cy="-106.4" r="1.1" fill="#FFFFFF"/>
      <g fill="#3A3A3A" stroke="#000000" stroke-width="2.5">
        <path d="M69 -94 Q63 -80 71 -76 Q79 -77 80 -86 Z"/>
        <path d="M95 -94 Q101 -80 93 -76 Q85 -77 84 -86 Z"/>
      </g>
      <path d="M77 -88 Q77 -82 82 -81 Q87 -82 87 -88 Z" fill="#3A3A3A" stroke="#000000" stroke-width="2"/>
      <path d="M78.5 -87 L80 -84 L81.5 -87 Z M82.5 -87 L84 -84 L85.5 -87 Z" fill="#FFFFFF"/>
      <rect x="69" y="-101" width="26" height="14" rx="6" fill="#4A4A4A" stroke="#000000" stroke-width="3"/>
      <path d="M75 -101 Q82 -105 89 -101 Q89 -95 82 -94 Q75 -95 75 -101 Z" fill="#000000"/>
      <ellipse cx="80" cy="-101" rx="2" ry="1.1" fill="#8A8A8A"/>
      <path d="M82 -94 V-91 M82 -91 Q77 -88 73 -91 M82 -91 Q87 -88 91 -91" fill="none" stroke="#000000" stroke-width="2"/>
    </g>
  </g>

  <!-- the drool: a long string hanging from his jowl, a drop on the pillow -->
  <g data-part="drool" transform="translate(-12 -4)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M330 222 Q329 230 330 236" fill="none" stroke="#BFE6FA" stroke-width="3.5"/>
    <path d="M330 234 Q325 242 330 246 Q335 242 330 234 Z" fill="#D9F2FF" stroke="#6FA8C8" stroke-width="1.6"/>
    <ellipse cx="322" cy="219" rx="5" ry="2" fill="#D9F2FF" stroke="#6FA8C8" stroke-width="1.4"/>
    <rect x="316" y="214" width="22" height="36" fill="transparent"/>
  </g>
</svg>
