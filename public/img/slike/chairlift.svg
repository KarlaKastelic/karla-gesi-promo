<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#DDEFFF"/>
  <!-- mountain -->
  <polygon points="90,140 150,58 214,140" fill="#9AA5B1" stroke="#5F6B78" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="137,76 150,58 163,76 156,71 150,79 144,71" fill="#FFFFFF"/>
  <!-- snowy slope -->
  <path d="M-2 128 Q90 136 202 176 V202 H-2 Z" fill="#F7FAFC" stroke="#9FB8CC" stroke-width="3"/>
  <!-- fir trees -->
  <g stroke="#1F4F2A" stroke-width="3" stroke-linejoin="round">
    <polygon points="22,108 32,136 12,136" fill="#2E7D32"/>
    <polygon points="174,142 186,174 162,174" fill="#2E7D32"/>
  </g>
  <!-- pylon -->
  <path d="M106 62 V150" stroke="#37474F" stroke-width="10" stroke-linecap="round"/>
  <path d="M106 62 V150" stroke="#78909C" stroke-width="5" stroke-linecap="round"/>
  <rect x="88" y="56" width="36" height="8" rx="2" fill="#78909C" stroke="#37474F" stroke-width="3"/>
  <circle cx="94" cy="57" r="4" fill="#555" stroke="#222" stroke-width="2"/>
  <circle cx="118" cy="60" r="4" fill="#555" stroke="#222" stroke-width="2"/>
  <ellipse cx="106" cy="150" rx="14" ry="3.5" fill="#000" opacity="0.12"/>
  <!-- cable -->
  <line x1="-2" y1="32" x2="202" y2="74" stroke="#263238" stroke-width="3"/>

  <!-- chair 1 -->
  <g transform="translate(46 41) scale(1.12)">
    <path d="M0 0 V36 Q0 42 -6 42 H-18 V70" fill="none" stroke="#263238" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-3" y="-3" width="6" height="7" rx="1.5" fill="#455A64" stroke="#263238" stroke-width="2"/>
    <path d="M-22 50 H-14 V74 H-22 Z" fill="#1565C0" stroke="#0D3C78" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 72 H18 V80 H-22 Z" fill="#1565C0" stroke="#0D3C78" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-4 42 Q20 40 22 58 V90 H34" fill="none" stroke="#C62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- chair 2 -->
  <g transform="translate(150 63) scale(1.12)">
    <path d="M0 0 V36 Q0 42 -6 42 H-18 V70" fill="none" stroke="#263238" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-3" y="-3" width="6" height="7" rx="1.5" fill="#455A64" stroke="#263238" stroke-width="2"/>
    <path d="M-22 50 H-14 V74 H-22 Z" fill="#1565C0" stroke="#0D3C78" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 72 H18 V80 H-22 Z" fill="#1565C0" stroke="#0D3C78" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-4 42 Q20 40 22 58 V90 H34" fill="none" stroke="#C62828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
