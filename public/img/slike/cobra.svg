<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Kobra: a cobra rearing up from its coils on the sand, hood spread wide with a single spectacle mark, forked tongue out -->
  <rect x="0" y="0" width="200" height="200" fill="#CDE8F2"/>
  <!-- sand dunes -->
  <path d="M0 132 Q50 116 100 128 Q150 140 200 124 V200 H0 Z" fill="#EBD49A" stroke="#C2A060" stroke-width="3"/>
  <path d="M0 162 Q60 150 120 160 Q170 168 200 158 V200 H0 Z" fill="#E2C47E"/>
  <!-- rock -->
  <path d="M146 150 Q148 122 170 118 Q194 116 198 138 Q200 156 190 158 H150 Q146 158 146 150 Z" fill="#A1887F" stroke="#5D4037" stroke-width="4" stroke-linejoin="round"/>
  <path d="M160 132 Q170 126 182 130" fill="none" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
  <!-- little cactus -->
  <g stroke="#2E7D32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 136 V102 Q20 94 26 94 Q32 94 32 102 V136 Z" fill="#66BB6A"/>
    <path d="M20 118 H12 Q8 118 8 112 V104" fill="none"/>
    <path d="M32 112 H38 Q42 112 42 106 V100" fill="none"/>
  </g>
  <ellipse cx="100" cy="182" rx="70" ry="8" fill="#000" opacity="0.1"/>

  <!-- coils on the sand -->
  <path d="M46 176 Q34 150 74 146 H130 Q166 150 156 176 Q148 186 100 186 Q54 186 46 176 Z" fill="#B8893A" stroke="#6B4A1A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 164 Q100 172 142 164" fill="none" stroke="#6B4A1A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M156 172 Q176 176 182 168 Q186 162 180 160" fill="none" stroke="#6B4A1A" stroke-width="10" stroke-linecap="round"/>
  <path d="M156 172 Q176 176 182 168 Q186 162 180 160" fill="none" stroke="#B8893A" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 150 Q80 140 100 144 Q124 140 140 150 Q120 158 100 156 Q80 158 60 150 Z" fill="#B8893A" stroke="#6B4A1A" stroke-width="4" stroke-linejoin="round"/>

  <!-- raised neck -->
  <path d="M86 150 Q82 128 88 112 H112 Q118 128 114 150 Z" fill="#B8893A" stroke="#6B4A1A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M92 150 Q90 130 94 114 H106 Q110 130 108 150 Z" fill="#EBCF8A"/>
  <path d="M93 124 H107 M92 136 H108" stroke="#C9A65A" stroke-width="3" stroke-linecap="round"/>

  <!-- hood spread wide -->
  <path d="M100 30 Q66 32 54 70 Q48 96 70 116 Q84 126 100 126 Q116 126 130 116 Q152 96 146 70 Q134 32 100 30 Z" fill="#B8893A" stroke="#6B4A1A" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M100 44 Q76 46 70 74 Q66 96 82 110 Q92 118 100 118 Q108 118 118 110 Q134 96 130 74 Q124 46 100 44 Z" fill="#EBCF8A"/>
  <!-- the single spectacle mark -->
  <g fill="none" stroke="#5A3A12" stroke-width="4" stroke-linecap="round">
    <circle cx="87" cy="94" r="7"/>
    <circle cx="113" cy="94" r="7"/>
    <path d="M94 92 Q100 88 106 92"/>
  </g>

  <!-- head on top of the hood -->
  <path d="M100 22 Q120 22 122 40 Q122 56 100 60 Q78 56 78 40 Q80 22 100 22 Z" fill="#C89A48" stroke="#6B4A1A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M88 52 Q100 58 112 52" fill="none" stroke="#6B4A1A" stroke-width="3" stroke-linecap="round"/>
  <!-- friendly eyes -->
  <circle cx="90" cy="36" r="6.5" fill="#FFFFFF" stroke="#3A2A1A" stroke-width="2"/>
  <circle cx="110" cy="36" r="6.5" fill="#FFFFFF" stroke="#3A2A1A" stroke-width="2"/>
  <circle cx="91" cy="37" r="3.6" fill="#111"/><circle cx="109" cy="37" r="3.6" fill="#111"/>
  <circle cx="89.6" cy="35.4" r="1.3" fill="#FFF"/><circle cx="107.6" cy="35.4" r="1.3" fill="#FFF"/>
  <circle cx="96" cy="47" r="1.4" fill="#6B4A1A"/><circle cx="104" cy="47" r="1.4" fill="#6B4A1A"/>
  <!-- forked tongue -->
  <path d="M100 58 V68 L95 75 M100 68 L105 75" fill="none" stroke="#8E1B1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 58 V68 L95 75 M100 68 L105 75" fill="none" stroke="#E53935" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
