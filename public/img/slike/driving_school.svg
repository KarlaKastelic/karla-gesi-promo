<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <ellipse cx="100" cy="166" rx="88" ry="8" fill="#000" opacity="0.12"/>
  <!-- roof sign: board with a steering wheel -->
  <rect x="86" y="62" width="8" height="12" fill="#546E7A"/>
  <rect x="112" y="62" width="8" height="12" fill="#546E7A"/>
  <path d="M74 64 L80 26 H126 L132 64 Z" fill="#FFFFFF" stroke="#0D47A1" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="103" cy="45" r="12" fill="none" stroke="#E53935" stroke-width="4.5"/>
  <path d="M91 45 H115 M103 45 V57" stroke="#E53935" stroke-width="4.5" stroke-linecap="round"/>
  <!-- car body -->
  <path d="M14 150 V128 Q14 116 28 114 L56 110 L74 80 Q80 72 92 72 H134 Q144 72 150 80 L168 110 Q186 112 188 126 V150 Z" fill="#42A5F5" stroke="#0D47A1" stroke-width="4" stroke-linejoin="round"/>
  <!-- windows -->
  <path d="M64 110 L80 84 Q84 80 90 80 H112 V110 Z" fill="#E3F2FC" stroke="#0D47A1" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M120 110 V80 H134 Q140 80 144 86 L160 110 Z" fill="#E3F2FC" stroke="#0D47A1" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- instructor -->
  <g transform="translate(96 96) scale(0.34)">
    <path d="M-40 60 Q-40 34 0 34 Q40 34 40 60 Z" fill="#43A047" stroke="#1B5E20" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="33" ry="38" fill="#F2C9A0" stroke="#B07A50" stroke-width="7"/>
    <path d="M-34 10 Q-40 -42 2 -42 Q34 -42 34 -8 Q24 -24 6 -24 Q-12 -22 -16 -2 Q-22 10 -34 10 Z" fill="#9E9E9E" stroke="#616161" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="-20" cy="6" rx="7" ry="10" fill="#F2C9A0" stroke="#B07A50" stroke-width="6"/>
    <circle cx="6" cy="0" r="6" fill="#3E2723"/>
    <circle cx="24" cy="0" r="6" fill="#3E2723"/>
    <path d="M8 24 Q16 29 24 24" fill="none" stroke="#8D4A3A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- learner driver -->
  <g transform="translate(134 96) scale(0.34)">
    <path d="M-40 60 Q-40 34 0 34 Q40 34 40 60 Z" fill="#1976D2" stroke="#0D47A1" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="33" ry="38" fill="#F2C9A0" stroke="#B07A50" stroke-width="7"/>
    <path d="M-34 10 Q-40 -40 2 -40 Q34 -40 34 -8 Q24 -24 6 -24 Q-12 -22 -16 -2 Q-22 10 -34 10 Z" fill="#6D4C41" stroke="#4E342E" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="-20" cy="6" rx="7" ry="10" fill="#F2C9A0" stroke="#B07A50" stroke-width="6"/>
    <circle cx="6" cy="0" r="6" fill="#3E2723"/>
    <circle cx="24" cy="0" r="6" fill="#3E2723"/>
    <path d="M8 24 Q16 29 24 24" fill="none" stroke="#8D4A3A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- steering wheel -->
  <ellipse cx="153" cy="104" rx="4" ry="10" transform="rotate(-20 153 104)" fill="none" stroke="#212121" stroke-width="4"/>
  <!-- lower body painted over the window edge -->
  <path d="M14 150 V128 Q14 116 28 114 L56 110 H168 Q186 112 188 126 V150 Z" fill="#42A5F5" stroke="#0D47A1" stroke-width="4" stroke-linejoin="round"/>
  <path d="M116 112 V148" stroke="#0D47A1" stroke-width="3" stroke-linecap="round"/>
  <!-- learner plate with a big red L -->
  <rect x="70" y="116" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/>
  <path d="M81 121 V140 H95" fill="none" stroke="#E53935" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="124" y="120" width="14" height="5" rx="2.5" fill="#0D47A1"/>
  <!-- lights -->
  <rect x="178" y="122" width="10" height="9" rx="2" fill="#FFF59D" stroke="#0D47A1" stroke-width="2"/>
  <rect x="14" y="122" width="8" height="9" rx="2" fill="#EF5350" stroke="#0D47A1" stroke-width="2"/>
  <!-- wheels -->
  <g stroke="#1E1E1E" stroke-width="4">
    <circle cx="52" cy="152" r="17" fill="#333"/>
    <circle cx="150" cy="152" r="17" fill="#333"/>
  </g>
  <circle cx="52" cy="152" r="7" fill="#C9C9C9"/>
  <circle cx="150" cy="152" r="7" fill="#C9C9C9"/>
</svg>
