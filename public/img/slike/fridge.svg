<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <ellipse cx="108" cy="189" rx="74" ry="7" fill="#000000" opacity="0.08"/>
  <!-- The fridge, its freezer closed and the cold part open, so it reads as a fridge and not a cupboard. -->
  <rect x="40" y="12" width="100" height="174" rx="10" fill="#F5F7F8" stroke="#546E7A" stroke-width="4" stroke-linejoin="round"/>
  <line x1="40" y1="62" x2="140" y2="62" stroke="#546E7A" stroke-width="3.5"/>
  <rect x="120" y="26" width="9" height="24" rx="3" fill="#90A4AE" stroke="#546E7A" stroke-width="2.5"/>
  <circle cx="58" cy="30" r="5" fill="#EF5350"/>
  <rect x="66" y="36" width="14" height="10" rx="2" fill="#FFCA28" transform="rotate(-8 73 41)"/>
  <!-- Inside: cold blue, with a light, shelves and food. -->
  <rect x="48" y="70" width="84" height="108" rx="4" fill="#DDEFFD" stroke="#546E7A" stroke-width="3"/>
  <ellipse cx="90" cy="76" rx="10" ry="3" fill="#FFF59D"/>
  <line x1="48" y1="102" x2="132" y2="102" stroke="#90A4AE" stroke-width="3"/>
  <line x1="48" y1="132" x2="132" y2="132" stroke="#90A4AE" stroke-width="3"/>
  <!-- Top shelf: milk and cheese. -->
  <path d="M56 101 V84 L62 77 H72 L78 84 V101 Z" fill="#FFFFFF" stroke="#546E7A" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="56" y="88" width="22" height="6" fill="#42A5F5"/>
  <path d="M88 101 V89 L116 95 V101 Z" fill="#FFD54F" stroke="#C49000" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="97" cy="96" r="2" fill="#E0A800"/>
  <circle cx="107" cy="98" r="1.6" fill="#E0A800"/>
  <!-- Middle shelf: eggs and an apple. -->
  <ellipse cx="60" cy="124" rx="6" ry="7.5" fill="#FFF3E0" stroke="#BCAAA4" stroke-width="2"/>
  <ellipse cx="73" cy="124" rx="6" ry="7.5" fill="#FFF3E0" stroke="#BCAAA4" stroke-width="2"/>
  <ellipse cx="86" cy="124" rx="6" ry="7.5" fill="#FFF3E0" stroke="#BCAAA4" stroke-width="2"/>
  <circle cx="113" cy="122" r="9" fill="#E53935" stroke="#B71C1C" stroke-width="2"/>
  <path d="M113 113 Q114 109 116 107" stroke="#6D4C41" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M116 110 Q122 106 124 111 Q119 113 116 110 Z" fill="#66BB6A"/>
  <!-- Vegetable drawer, a lettuce and a carrot peeping out. -->
  <circle cx="72" cy="150" r="10" fill="#81C784" stroke="#388E3C" stroke-width="2"/>
  <path d="M96 156 L120 141 L123 146 Z" fill="#FF8A00" stroke="#E65100" stroke-width="2" stroke-linejoin="round"/>
  <path d="M120 141 L126 135 M121 142 L128 140" stroke="#43A047" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="54" y="150" width="72" height="22" rx="4" fill="#B3E5FC" stroke="#546E7A" stroke-width="2.5" opacity="0.92"/>
  <line x1="80" y1="160" x2="100" y2="160" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
  <!-- The open door, swung out to the right, with bottles in its racks. -->
  <path d="M140 66 L180 78 V176 L140 186 Z" fill="#F5F7F8" stroke="#546E7A" stroke-width="4" stroke-linejoin="round"/>
  <rect x="148" y="86" width="8" height="20" rx="2" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  <rect x="150" y="81" width="4" height="6" fill="#2E7D32"/>
  <rect x="161" y="90" width="9" height="17" rx="2" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
  <path d="M144 108 L176 114" stroke="#90A4AE" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="149" y="132" width="10" height="18" rx="2" fill="#FFFFFF" stroke="#546E7A" stroke-width="2"/>
  <rect x="149" y="137" width="10" height="5" fill="#EF5350"/>
  <rect x="163" y="134" width="9" height="17" rx="2" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="2"/>
  <path d="M144 152 L176 154" stroke="#90A4AE" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="44" y="186" width="10" height="4" rx="1" fill="#546E7A"/>
  <rect x="126" y="186" width="10" height="4" rx="1" fill="#546E7A"/>
</svg>
