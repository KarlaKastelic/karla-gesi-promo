  <path d="M70 86 Q76 66 100 66 Q124 66 130 86 Q120 76 110 80 Q104 74 98 79 Q90 74 82 80 Q76 78 70 86 Z" fill="#DCE3E8" stroke="#90A4AE" stroke-width="2.5" stroke-linejoin="round"/>
