  </g>
  <g fill="#F48FB1" opacity="0.55"><circle cx="80" cy="112" r="6"/><circle cx="120" cy="112" r="6"/></g>
  <!-- the red headscarf, round the face -->
  <path d="M100 18 C154 18 170 62 164 104 C160 130 136 146 112 152 L88 152 C64 146 40 130 36 104 C30 62 46 18 100 18 Z M100 68 C80 68 70 82 70 102 C70 124 84 138 100 138 C116 138 130 124 130 102 C130 82 120 68 100 68 Z" fill="#E53935" fill-rule="evenodd" stroke="#8E1B1B" stroke-width="4" stroke-linejoin="round"/>
  <!-- ends hanging from the knot -->
  <path d="M94 154 L60 190 Q76 200 92 188 L100 166 Z M106 154 L140 190 Q124 200 108 188 L100 166 Z" fill="#E53935" stroke="#8E1B1B" stroke-width="4" stroke-linejoin="round"/>
