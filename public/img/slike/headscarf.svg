  <g fill="#FFFFFF">
    <circle cx="100" cy="34" r="5"/><circle cx="76" cy="40" r="5"/><circle cx="124" cy="40" r="5"/>
    <circle cx="58" cy="58" r="5"/><circle cx="142" cy="58" r="5"/>
    <circle cx="50" cy="82" r="5"/><circle cx="150" cy="82" r="5"/>
    <circle cx="50" cy="108" r="5"/><circle cx="150" cy="108" r="5"/>
    <circle cx="62" cy="130" r="5"/><circle cx="138" cy="130" r="5"/>
    <circle cx="80" cy="56" r="4"/><circle cx="120" cy="56" r="4"/>
    <circle cx="80" cy="186" r="4"/><circle cx="120" cy="186" r="4"/>
