  <path d="M84 144 L100 200 M116 144 L100 200" fill="none" stroke="#6E5E85" stroke-width="3"/>
  <!-- face -->
  <ellipse cx="100" cy="102" rx="31" ry="37" fill="#F2C9A0" stroke="#B07A50" stroke-width="4"/>
