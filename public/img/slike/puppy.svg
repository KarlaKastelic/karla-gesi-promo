  <path d="M128 156 Q156 146 154 120" fill="none" stroke="#8A5A24" stroke-width="13" stroke-linecap="round"/>
  <path d="M128 156 Q156 146 154 120" fill="none" stroke="#E8B66A" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M160 116 Q166 122 164 130 M164 108 Q172 114 172 124" fill="none" stroke="#8A5A24" stroke-width="2.5" stroke-linecap="round"/>
