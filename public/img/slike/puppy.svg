  <ellipse cx="132" cy="160" rx="20" ry="16" fill="#E8B66A" stroke="#8A5A24" stroke-width="4"/>
  <!-- small round body -->
  <path d="M68 168 Q62 122 100 112 Q138 122 132 168 Z" fill="#E8B66A" stroke="#8A5A24" stroke-width="4" stroke-linejoin="round"/>
