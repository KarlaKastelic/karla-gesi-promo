  <path d="M86 132 L86 164 M114 132 L114 164" fill="none" stroke="#8A5A24" stroke-width="19" stroke-linecap="round"/>
  <path d="M86 132 L86 164 M114 132 L114 164" fill="none" stroke="#E8B66A" stroke-width="12" stroke-linecap="round"/>
  <!-- big paws -->
  <ellipse cx="86" cy="170" rx="17" ry="10" fill="#FFF1D6" stroke="#8A5A24" stroke-width="4"/>
  <ellipse cx="114" cy="170" rx="17" ry="10" fill="#FFF1D6" stroke="#8A5A24" stroke-width="4"/>
  <path d="M80 166 V174 M88 166 V175 M108 166 V175 M116 166 V174" stroke="#8A5A24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- big head -->
  <ellipse cx="100" cy="72" rx="46" ry="42" fill="#E8B66A" stroke="#8A5A24" stroke-width="4"/>
  <!-- floppy ears -->
  <path d="M64 44 Q38 44 36 76 Q36 104 52 106 Q64 102 66 80 Q68 60 64 44 Z" fill="#A8692E" stroke="#6A3E14" stroke-width="4" stroke-linejoin="round"/>
  <path d="M136 44 Q162 44 164 76 Q164 104 148 106 Q136 102 134 80 Q132 60 136 44 Z" fill="#A8692E" stroke="#6A3E14" stroke-width="4" stroke-linejoin="round"/>
  <!-- tuft -->
  <path d="M92 32 Q96 22 100 30 Q104 20 108 32" fill="none" stroke="#8A5A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="94" rx="24" ry="17" fill="#FFF1D6" stroke="#C8955A" stroke-width="2"/>
  <!-- tongue -->
  <path d="M93 100 Q93 116 100 116 Q107 116 107 100 Z" fill="#F06292" stroke="#AD1457" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M100 102 V111" stroke="#AD1457" stroke-width="1.8" stroke-linecap="round"/>
  <!-- nose and mouth -->
  <ellipse cx="100" cy="85" rx="9" ry="6.5" fill="#2B1A10"/>
  <ellipse cx="97" cy="83" rx="2.5" ry="1.5" fill="#8A7A70"/>
  <path d="M100 91 V96 M100 96 Q92 104 84 98 M100 96 Q108 104 116 98" fill="none" stroke="#2B1A10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- big eyes -->
  <circle cx="80" cy="66" r="8.5" fill="#2B1A10"/>
  <circle cx="120" cy="66" r="8.5" fill="#2B1A10"/>
  <circle cx="83" cy="63" r="3" fill="#FFF"/>
  <circle cx="123" cy="63" r="3" fill="#FFF"/>
  <path d="M72 52 Q79 48 86 52 M114 52 Q121 48 128 52" fill="none" stroke="#8A5A24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- toy ball -->
  <circle cx="168" cy="164" r="14" fill="#E53935" stroke="#8E1B1B" stroke-width="3.5"/>
  <path d="M156 158 Q168 166 180 158" fill="none" stroke="#FFF" stroke-width="3.5" stroke-linecap="round"/>
