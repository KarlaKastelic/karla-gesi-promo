<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- twig -->
  <path d="M6 164 Q100 156 196 162" fill="none" stroke="#5D4037" stroke-width="9" stroke-linecap="round"/>
  <path d="M150 160 L172 146" fill="none" stroke="#5D4037" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="176" cy="142" rx="9" ry="5" fill="#7CB342" stroke="#33691E" stroke-width="2.5" transform="rotate(-30 176 142)"/>
  <!-- cocked tail -->
  <path d="M50 126 L14 104 Q8 112 16 120 L48 140 Z" fill="#7A4E26" stroke="#3E2814" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- legs -->
  <path d="M96 146 L92 162 M112 146 L114 162" fill="none" stroke="#B08060" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 162 L98 162 M108 162 L120 162" stroke="#B08060" stroke-width="3.5" stroke-linecap="round"/>
  <!-- chubby round body, grey belly -->
  <ellipse cx="100" cy="112" rx="56" ry="40" fill="#CFC6B8" stroke="#5A4630" stroke-width="4"/>
  <!-- brown back and wing with black streaks -->
  <path d="M46 116 Q46 78 96 74 Q128 74 134 94 Q124 124 90 134 Q58 134 46 116 Z" fill="#9A6332" stroke="#3E2814" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#2E1E10" stroke-width="3.5" stroke-linecap="round">
    <path d="M62 98 Q74 92 86 92"/><path d="M58 110 Q74 104 92 104"/><path d="M66 122 Q82 118 100 116"/><path d="M96 86 Q108 84 118 90"/>
  </g>
  <path d="M84 110 Q100 106 118 100" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="144" cy="78" r="28" fill="#E9E4DA" stroke="#5A4630" stroke-width="4"/>
  <!-- grey crown -->
  <path d="M118 72 Q122 50 146 50 Q166 52 170 66 Q150 64 132 72 Z" fill="#8E8E8E" stroke="#5A4630" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- chestnut stripe behind the eye -->
  <path d="M116 80 Q124 66 146 68 L150 74 Q132 76 124 92 Q116 90 116 80 Z" fill="#8B4A1E"/>
  <!-- black bib -->
  <path d="M150 92 Q158 96 168 88 Q166 108 150 112 Q140 110 140 100 Q146 98 150 92 Z" fill="#1C1C1C" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <!-- short thick beak -->
  <path d="M166 74 L184 82 L166 90 Z" fill="#3A3A3A" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="156" cy="74" r="4" fill="#111"/>
  <circle cx="157.5" cy="72.5" r="1.4" fill="#FFF"/>
</svg>
