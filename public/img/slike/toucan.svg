  <!-- huge orange-yellow beak -->
  <path d="M118 42 Q162 30 192 52 Q198 60 190 64 Q156 72 118 70 Z" fill="#FF9800" stroke="#9A4E08" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M120 46 Q160 34 186 50 Q156 52 120 56 Z" fill="#FFC107"/>
  <path d="M176 50 Q194 52 194 60 Q192 64 182 66 Q176 58 176 50 Z" fill="#1C1C1C"/>
