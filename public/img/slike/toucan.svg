  <path d="M124 62 Q158 60 190 60" fill="none" stroke="#9A4E08" stroke-width="2" stroke-linecap="round"/>
  <path d="M119 44 L119 69" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
  <!-- eye with blue ring -->
  <circle cx="106" cy="52" r="8" fill="#FF9800"/>
  <circle cx="106" cy="52" r="5.5" fill="#29B6F6" stroke="#0277BD" stroke-width="1.5"/>
