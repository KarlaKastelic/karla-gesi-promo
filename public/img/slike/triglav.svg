<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Triglav - Slovenia's highest mountain seen from the north: the massive grey limestone summit with its three-headed outline (main peak in the middle, lower shoulders either side), the big north face, a little snow, the tiny silver Aljaz tower with a flag on the very top; alpine meadow and larches in front -->
  <rect x="0" y="0" width="200" height="200" fill="#BFE3FA"/>
  <g fill="#FFFFFF" stroke="#B8D4E6" stroke-width="2.5">
    <path d="M20 34 Q20 24 30 24 Q34 16 44 18 Q54 16 56 26 Q64 28 62 36 Z"/>
    <path d="M150 26 Q150 18 158 18 Q162 12 170 14 Q178 13 180 20 Q186 22 184 28 Z"/>
  </g>

  <!-- the mountain: three heads, the middle one highest -->
  <path d="M-6 150 L-6 116 L22 92 L44 70 Q48 66 52 70 L72 86 L96 46 Q100 42 104 46 L128 80 L150 64 Q154 60 158 64 L182 90 L206 112 V150 Z" fill="#A9AFB6" stroke="#58606A" stroke-width="4" stroke-linejoin="round"/>
  <!-- the big north face: darker rock wall under the summit -->
  <path d="M96 46 Q100 42 104 46 L118 66 L124 100 L130 150 H72 L78 100 L84 70 Z" fill="#8D949C"/>
  <!-- broad gullies and ledges -->
  <g fill="none" stroke="#6F7780" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 52 L96 76 L100 100 L96 130"/>
    <path d="M48 74 L42 100 L48 124"/>
    <path d="M154 68 L160 94 L154 118"/>
  </g>
  <!-- a little snow in the gullies and on the ledges -->
  <g fill="#FFFFFF" stroke="#A9B7C4" stroke-width="2.5" stroke-linejoin="round">
    <path d="M106 64 L114 82 L111 100 Q107 110 103 98 L106 82 Q102 74 106 64 Z"/>
    <path d="M54 80 L60 92 L58 106 Q55 112 52 102 L55 92 Q51 86 54 80 Z"/>
    <path d="M144 78 L150 90 L147 104 Q144 110 141 100 L144 90 Q140 84 144 78 Z"/>
    <path d="M78 136 Q100 116 124 136 Q100 141 78 136 Z"/>
    <path d="M62 88 Q66 84 70 90 Q66 94 62 88 Z"/>
    <path d="M132 84 Q136 80 140 86 Q136 90 132 84 Z"/>
  </g>
  <!-- light scree at the foot of the wall -->
  <path d="M-6 150 V136 Q30 126 60 136 Q100 128 140 136 Q170 126 206 134 V150 Z" fill="#D6D9DC" stroke="#9AA2AA" stroke-width="3" stroke-linejoin="round"/>

  <!-- Aljaz tower on the summit: small silver cylinder with a pointed cap and a flag -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M100 21 V9" stroke="#37474F" stroke-width="2"/>
    <path d="M100 10 L112 12 L100 16 Z" fill="#E53935" stroke="#8E1B1B" stroke-width="1.5"/>
    <rect x="94" y="30" width="12" height="15" rx="2" fill="#E3E8EC" stroke="#455A64" stroke-width="2.5"/>
    <path d="M94 37 H106" stroke="#90A4AE" stroke-width="2"/>
    <path d="M92 31 L100 20 L108 31 Z" fill="#CFD8DC" stroke="#455A64" stroke-width="2.5"/>
  </g>

  <!-- dark forest belt -->
  <path d="M-6 160 L4 140 L12 154 L22 136 L32 152 L42 138 L52 154 L62 140 L72 154 L82 142 L92 156 L102 142 L112 156 L122 140 L132 154 L142 138 L152 152 L162 136 L172 152 L182 140 L192 154 L206 138 V170 H-6 Z" fill="#2E6B3A" stroke="#1E4D2B" stroke-width="3" stroke-linejoin="round"/>

  <!-- green alpine meadow -->
  <path d="M-6 204 V166 Q50 156 100 164 Q150 156 206 164 V204 Z" fill="#8BC34A" stroke="#5E8C30" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#C0CA33" stroke-width="1.5">
    <circle cx="70" cy="182" r="2.5"/><circle cx="96" cy="190" r="2.5"/><circle cx="120" cy="178" r="2.5"/><circle cx="84" cy="174" r="2"/>
  </g>
  <g fill="#FFEB3B">
    <circle cx="108" cy="186" r="2.5"/><circle cx="60" cy="192" r="2.5"/><circle cx="132" cy="190" r="2"/>
  </g>

  <!-- larches (light green) and a dark pine in front -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="22" y="174" width="7" height="20" fill="#8B5A2B" stroke="#4A2E14" stroke-width="3"/>
    <path d="M26 116 L36 136 H30 L42 156 H34 L46 178 H6 L18 156 H10 L22 136 H16 Z" fill="#9CCC65" stroke="#558B2F" stroke-width="3"/>
    <rect x="170" y="172" width="7" height="22" fill="#8B5A2B" stroke="#4A2E14" stroke-width="3"/>
    <path d="M174 108 L186 132 H179 L192 154 H184 L198 176 H150 L164 154 H156 L169 132 H162 Z" fill="#9CCC65" stroke="#558B2F" stroke-width="3"/>
    <rect x="148" y="178" width="6" height="14" fill="#8B5A2B" stroke="#4A2E14" stroke-width="3"/>
    <path d="M151 140 L162 162 H157 L166 180 H136 L145 162 H140 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>
  </g>
</svg>
