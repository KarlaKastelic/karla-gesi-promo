  <rect x="26" y="174" width="12" height="10" fill="#6D4223" stroke="#4A2E14" stroke-width="3"/>
  <rect x="130" y="174" width="12" height="10" fill="#6D4223" stroke="#4A2E14" stroke-width="3"/>
  <!-- carcass -->
  <rect x="20" y="20" width="128" height="156" fill="#B97A45" stroke="#5A3414" stroke-width="4" stroke-linejoin="round"/>
  <rect x="14" y="12" width="140" height="12" rx="3" fill="#A86E3F" stroke="#5A3414" stroke-width="4"/>
  <!-- interior (right half) -->
  <rect x="86" y="28" width="56" height="142" fill="#4E342E" stroke="#3E2723" stroke-width="3"/>
  <line x1="86" y1="40" x2="142" y2="40" stroke="#B0BEC5" stroke-width="4"/>
  <!-- clothes on hangers -->
  <g stroke-linejoin="round">
    <path d="M96 40 V44 M90 50 L96 44 L102 50" fill="none" stroke="#CFD8DC" stroke-width="2.5"/>
    <path d="M88 50 H104 L106 120 H86 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="3"/>
    <path d="M114 40 V44 M108 50 L114 44 L120 50" fill="none" stroke="#CFD8DC" stroke-width="2.5"/>
    <path d="M106 50 H122 L128 140 H100 Z" fill="#E53935" stroke="#7F1414" stroke-width="3"/>
    <path d="M132 40 V44 M126 50 L132 44 L138 50" fill="none" stroke="#CFD8DC" stroke-width="2.5"/>
    <path d="M124 50 H140 V112 H124 Z" fill="#7CB342" stroke="#33691E" stroke-width="3"/>
  </g>
  <!-- left door, closed -->
  <rect x="24" y="28" width="60" height="142" fill="#C88A52" stroke="#5A3414" stroke-width="3.5"/>
  <rect x="32" y="38" width="44" height="122" fill="none" stroke="#A86E3F" stroke-width="3"/>
  <circle cx="76" cy="100" r="4.5" fill="#F2C94C" stroke="#8C6A1E" stroke-width="2"/>
  <!-- right door, swung open -->
  <path d="M146 28 L190 18 V182 L146 170 Z" fill="#C88A52" stroke="#5A3414" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M154 38 L182 32 V168 L154 160 Z" fill="none" stroke="#A86E3F" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="184" cy="100" r="4" fill="#F2C94C" stroke="#8C6A1E" stroke-width="2"/>
</svg>
