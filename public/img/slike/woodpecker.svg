<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- tree trunk -->
  <rect x="-6" y="-6" width="80" height="212" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
  <g fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round">
    <path d="M14 10 Q10 40 16 70"/><path d="M40 0 Q46 30 40 56"/><path d="M58 80 Q52 110 58 140"/>
    <path d="M18 110 Q12 140 18 170"/><path d="M42 150 Q48 175 42 200"/>
  </g>
  <ellipse cx="34" cy="96" rx="8" ry="11" fill="#3E2723" stroke="#2A1A14" stroke-width="3"/>
  <!-- stiff tail pressed on trunk -->
  <path d="M104 150 L80 196 L94 198 L120 156 Z" fill="#1C1C1C" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- body (belly against the trunk) -->
  <path d="M86 66 Q74 108 86 148 Q102 170 122 158 Q150 120 144 80 Q136 54 112 52 Q92 54 86 66 Z" fill="#F4EFE4" stroke="#6D6D6D" stroke-width="4" stroke-linejoin="round"/>
  <!-- red under the tail -->
  <path d="M84 132 Q90 160 112 162 Q104 150 100 136 Z" fill="#D32F2F" stroke="#8E1B12" stroke-width="3" stroke-linejoin="round"/>
  <!-- black back and wing -->
  <path d="M110 58 Q146 62 148 100 Q146 140 120 164 Q112 120 110 58 Z" fill="#1C1C1C" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M116 68 Q136 72 138 98 Q126 92 118 82 Z" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="2"/>
  <g fill="#FFFFFF">
    <rect x="124" y="108" width="10" height="4" rx="2"/><rect x="122" y="120" width="10" height="4" rx="2"/>
    <rect x="120" y="132" width="10" height="4" rx="2"/><rect x="118" y="144" width="8" height="4" rx="2"/>
    <rect x="136" y="114" width="7" height="4" rx="2"/><rect x="133" y="126" width="7" height="4" rx="2"/>
  </g>
  <!-- feet gripping bark -->
  <path d="M90 116 L74 110 M90 120 L74 122 M92 124 L76 132" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="108" cy="40" r="24" fill="#FFFFFF" stroke="#6D6D6D" stroke-width="4"/>
  <path d="M86 32 Q92 14 112 16 Q128 18 132 34 Q118 28 104 28 Q94 28 86 32 Z" fill="#1C1C1C" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- red nape patch -->
  <path d="M124 26 Q134 30 132 44 Q126 44 122 36 Z" fill="#D32F2F" stroke="#8E1B12" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- black moustache stripe -->
  <path d="M88 48 Q108 54 122 46 Q126 52 130 50 Q122 60 104 58 Q92 56 88 48 Z" fill="#1C1C1C"/>
  <!-- beak to the trunk -->
  <path d="M88 36 L66 42 L88 46 Z" fill="#455A64" stroke="#263238" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="98" cy="38" r="3.5" fill="#111"/>
</svg>
